{% extends "base.html" %}

{% block title %}Research History{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-clock-history me-2"></i>Research History</h2>
        <div class="d-flex gap-2">
            <div class="input-group" style="width: 300px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search objectives...">
            </div>
            <select class="form-select" style="width: 150px;" id="statusFilter">
                <option value="">All Status</option>
                <option value="completed">Completed</option>
                <option value="running">Running</option>
                <option value="failed">Failed</option>
                <option value="pending">Pending</option>
            </select>
            <select class="form-select" style="width: 150px;" id="sortOrder">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </div>
    </div>

    <!-- Results Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>
                                <input type="checkbox" class="form-check-input" id="selectAll">
                            </th>
                            <th>Objective</th>
                            <th>Status</th>
                            <th>Tools</th>
                            <th>Results</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div>
                <span id="showingCount">Showing 0 of 0</span>
                <button class="btn btn-sm btn-outline-danger ms-3" id="deleteSelectedBtn" style="display: none;">
                    <i class="bi bi-trash me-1"></i>Delete Selected
                </button>
            </div>
            <nav>
                <ul class="pagination mb-0" id="pagination">
                </ul>
            </nav>
        </div>
    </div>

    <!-- Bulk Actions -->
    <div class="card mt-4">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-gear me-2"></i>Bulk Actions</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="exportSelected('json')">
                        <i class="bi bi-download me-2"></i>Export Selected (JSON)
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="compareSelected()">
                        <i class="bi bi-intersect me-2"></i>Compare Selected
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-secondary w-100" onclick="clearHistory()">
                        <i class="bi bi-trash me-2"></i>Clear Failed Sessions
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const pageSize = 20;
let totalSessions = 0;
let sessions = [];

document.addEventListener('DOMContentLoaded', function() {
    loadHistory();

    // Search input
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentPage = 1;
            loadHistory();
        }, 300);
    });

    // Status filter
    document.getElementById('statusFilter').addEventListener('change', function() {
        currentPage = 1;
        loadHistory();
    });

    // Sort order
    document.getElementById('sortOrder').addEventListener('change', function() {
        currentPage = 1;
        loadHistory();
    });

    // Select all checkbox
    document.getElementById('selectAll').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.session-checkbox');
        checkboxes.forEach(cb => cb.checked = this.checked);
        updateBulkActions();
    });
});

async function loadHistory() {
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('statusFilter').value;
    const sort = document.getElementById('sortOrder').value;

    let url = `/api/research/history?limit=${pageSize}&offset=${(currentPage - 1) * pageSize}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (status) url += `&status=${status}`;
    if (sort === 'oldest') url += `&sort=asc`;

    try {
        const response = await fetch(url, {
            headers: getAuthHeaders()
        });

        if (response.ok) {
            const data = await response.json();
            sessions = data.sessions || data;
            totalSessions = data.total || sessions.length;
            renderTable();
            renderPagination();
        }
    } catch (error) {
        console.error('Failed to load history:', error);
        showToast('Failed to load history', 'danger');
    }
}

function renderTable() {
    const tbody = document.getElementById('historyTable');

    if (sessions.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    No research sessions found
                </td>
            </tr>
        `;
        document.getElementById('showingCount').textContent = 'Showing 0 of 0';
        return;
    }

    tbody.innerHTML = sessions.map(session => `
        <tr>
            <td>
                <input type="checkbox" class="form-check-input session-checkbox" value="${session.id}"
                    onchange="updateBulkActions()">
            </td>
            <td>
                <a href="/research/${session.id}" class="text-decoration-none">
                    <span class="text-truncate d-inline-block" style="max-width: 300px;" title="${escapeHtml(session.objective)}">
                        ${escapeHtml(session.objective)}
                    </span>
                </a>
            </td>
            <td>
                <span class="badge bg-${getStatusColor(session.status)}">${session.status}</span>
            </td>
            <td>
                ${(session.tools || []).map(t => `<span class="badge bg-secondary me-1">${t}</span>`).join('')}
            </td>
            <td>${session.results_count || 0}</td>
            <td><small class="text-muted">${formatDate(session.created_at)}</small></td>
            <td>
                <div class="btn-group btn-group-sm">
                    <a href="/research/${session.id}" class="btn btn-outline-primary" title="View">
                        <i class="bi bi-eye"></i>
                    </a>
                    <button class="btn btn-outline-secondary" onclick="duplicateSession('${session.id}')" title="Duplicate">
                        <i class="bi bi-copy"></i>
                    </button>
                    <button class="btn btn-outline-danger" onclick="deleteSession('${session.id}')" title="Delete">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </td>
        </tr>
    `).join('');

    const start = (currentPage - 1) * pageSize + 1;
    const end = Math.min(currentPage * pageSize, totalSessions);
    document.getElementById('showingCount').textContent = `Showing ${start}-${end} of ${totalSessions}`;
}

function renderPagination() {
    const totalPages = Math.ceil(totalSessions / pageSize);
    const pagination = document.getElementById('pagination');

    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">&laquo;</a>
        </li>
    `;

    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
                </li>
            `;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }

    html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">&raquo;</a>
        </li>
    `;

    pagination.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > Math.ceil(totalSessions / pageSize)) return;
    currentPage = page;
    loadHistory();
}

function updateBulkActions() {
    const selected = document.querySelectorAll('.session-checkbox:checked').length;
    document.getElementById('deleteSelectedBtn').style.display = selected > 0 ? 'inline-block' : 'none';
}

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.session-checkbox:checked')).map(cb => cb.value);
}

async function deleteSession(id) {
    if (!confirm('Are you sure you want to delete this session?')) return;

    try {
        const response = await fetch(`/api/research/${id}`, {
            method: 'DELETE',
            headers: getAuthHeaders()
        });

        if (response.ok) {
            showToast('Session deleted', 'success');
            loadHistory();
        } else {
            showToast('Failed to delete session', 'danger');
        }
    } catch (error) {
        showToast('Error: ' + error.message, 'danger');
    }
}

async function duplicateSession(id) {
    const session = sessions.find(s => s.id === id);
    if (!session) return;

    window.location.href = `/research/new?objective=${encodeURIComponent(session.objective)}&tools=${session.tools.join(',')}`;
}

async function exportSelected(format) {
    const ids = getSelectedIds();
    if (ids.length === 0) {
        showToast('Please select sessions to export', 'warning');
        return;
    }

    try {
        const response = await fetch('/api/research/export/bulk', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...getAuthHeaders()
            },
            body: JSON.stringify({ session_ids: ids, format: format })
        });

        if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `research_export.${format}`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();
            showToast('Export successful', 'success');
        }
    } catch (error) {
        showToast('Export failed: ' + error.message, 'danger');
    }
}

async function compareSelected() {
    const ids = getSelectedIds();
    if (ids.length < 2) {
        showToast('Please select at least 2 sessions to compare', 'warning');
        return;
    }

    window.location.href = `/compare?ids=${ids.join(',')}`;
}

async function clearHistory() {
    if (!confirm('Are you sure you want to delete all failed sessions?')) return;

    try {
        const response = await fetch('/api/research/cleanup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...getAuthHeaders()
            },
            body: JSON.stringify({ status: 'failed' })
        });

        if (response.ok) {
            const data = await response.json();
            showToast(`Deleted ${data.deleted} failed sessions`, 'success');
            loadHistory();
        }
    } catch (error) {
        showToast('Failed to clear history: ' + error.message, 'danger');
    }
}
</script>
{% endblock %}
